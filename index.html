<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mission Log</title>
  <meta name="description" content="Offline CAP observer mission log, checklist and sketch pad.">
  <meta name="theme-color" content="#1c2632">
  <meta name="format-detection" content="telephone=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mission Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand" data-act="show-missions" role="button" tabindex="0" aria-label="All missions" title="All missions">
          <img class="brand-logo" src="icons/logo.png" alt="Mission Log" width="148" height="46">
        </div>
        <span class="brand-pipe gps-pipe" aria-hidden="true"></span>
        <button class="gps-chip" id="gpsChip" type="button" data-act="gps-chip" data-level="off" aria-label="GPS status">
          <span class="gps-pos mono" id="gpsPos" hidden></span>
          <span class="gps-grid" id="gpsGrid" hidden></span>
          <span class="gps-sep" id="gpsSep" aria-hidden="true" hidden></span>
          <span class="gps-meta"><svg class="gps-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg><span id="gpsLabel">GPS off</span></span>
        </button>
        <span class="brand-pipe" aria-hidden="true"></span>
        <div class="mission-bar">
          <button class="mission-strip" type="button" data-act="edit-mission" aria-label="Edit mission details">
            <span class="mission-strip-main" id="stripMain">New Mission</span>
            <span class="start-here" id="stripCallout">Start Here</span>
          </button>
          <button class="sortie-switch" id="sortieSwitch" type="button" data-act="sortie-menu" aria-label="Switch or add sortie">
            <span id="sortieLabel">Sortie 1</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button class="mission-strip-sub" id="stripSub" type="button" data-act="edit-mission" aria-label="Edit mission details"></button>
        </div>
        <div class="top-actions">
          <div class="brand-sub"><span class="save-dot" id="saveDot"></span><span id="saveLabel">On this device</span></div>
          <button class="icon-btn" type="button" data-act="print" aria-label="Print or save PDF" title="Print / Save PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
            </svg>
          </button>
          <button class="icon-btn" type="button" data-act="menu" aria-label="Menu" title="Logs, export, settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main" id="view"></main>

    <nav class="tabbar" id="tabbar" aria-label="Sections">
      <button type="button" class="tab" data-tab="logbook" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 7.5h7M9 11h5"/></svg>
        Missions
      </button>
      <button type="button" class="tab" data-tab="plan" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10h7M8.5 14h7M8.5 18h4"/></svg>
        Sorties
      </button>
      <button type="button" class="tab active" data-tab="fly" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5Z"/></svg>
        Fly
      </button>
      <button type="button" class="tab" data-tab="notes" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.5 18.5 3 20l1.5-4.5Z"/></svg>
        Notes
      </button>
      <button type="button" class="tab" data-tab="debrief" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v4h-4"/></svg>
        Debrief
      </button>
      <button type="button" class="tab" data-tab="sign" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c2.2-5.5 4.3-8.5 5.8-8.5 2.4 0-1.6 8 .9 8 1.6 0 2.3-3.2 3.7-3.2 1.2 0 .8 2.4 2.2 2.4.9 0 1.6-.7 2.6-.7"/><path d="M3 20h18"/></svg>
        Sign
      </button>
    </nav>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="print"></div>

  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif">
      <h1>Mission Log</h1>
      <p>This app needs JavaScript. Enable it in Settings → Safari → Advanced, then reload.</p>
    </div>
  </noscript>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
